domain: "uds.dev"

sso:
  enabled: true
  secretName: reference-package-sso

postgres:
  username: "reference"
  # Note: Specifying password as anything other than "" will not use the existingSecret
  password: ""
  existingSecret:
    name: "reference-package.reference-package.pg-cluster.credentials.postgresql.acid.zalan.do"
    passwordKey: password
    usernameKey: username
  host: "pg-cluster.postgres.svc.cluster.local"
  dbName: "reference"
  # Example: "?connect_timeout=10&sslmode=disable"
  connectionOptions: "?sslmode=disable"
  # Set to false to use external postgres
  internal: true
  selector:
    cluster-name: pg-cluster
  namespace: postgres
  port: 5432

objectStorage:
  # Set to true to wire the app to object storage (provisioned by the minio-operator apps override)
  enabled: false
  bucket: "reference"
  endpoint: "uds-minio-hl.minio.svc.cluster.local:9000"
  useSSL: false
  # Credentials copied into this namespace by the minio-operator apps override.
  # Note: Setting accessKey/secretKey to anything other than "" will not use the existingSecret
  accessKey: ""
  secretKey: ""
  existingSecret:
    name: "reference-package-minio"
    accessKeyKey: access_key
    secretKeyKey: secret_key
  # Set to false to use external object storage
  internal: true
  selector:
    v1.min.io/tenant: uds-minio
  namespace: minio
  port: 9000
  # Credentials secret rendered by the uds-reference-package-config chart
  secretName: "reference-package-minio-creds"
  accessKeyKey: "S3_ACCESS_KEY"
  secretKeyKey: "S3_SECRET_KEY"

additionalNetworkAllow: []

monitoring:
  enabled: true

database:
  secretName: "reference-package-postgres"
  secretKey: "PASSWORD"

# Wire Core's trust bundle through the application chart's generic extensions.
extraVolumes:
  - name: uds-trust-bundle
    configMap:
      name: uds-trust-bundle
      # Core does not create this ConfigMap when no CA bundle is configured.
      optional: true
extraVolumeMounts:
  - name: uds-trust-bundle
    mountPath: /etc/uds/certs
    readOnly: true
extraEnv:
  # Go loads these additional CAs alongside the image's system CA bundle.
  - name: SSL_CERT_DIR
    value: /etc/ssl/certs:/etc/uds/certs

# Pod-level security
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

logging:
  dbLevel: "debug" # error, warn, info, debug
