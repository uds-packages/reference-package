uds-postgres-config:
  postgresql:
    enabled: true
    teamId: uds
    volume:
      size: 10Gi
    numberOfInstances: 2
    users:
      reference-package.reference-package: []
    databases:
      reference: reference-package.reference-package
    version: "15"
    ingress:
      - remoteNamespace: reference-package
