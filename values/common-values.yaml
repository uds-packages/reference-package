# Values common to all flavors

sso:
  enabled: true
  secretName: reference-package-sso
monitoring:
  enabled: true

objectStorage:
  enabled: false
  bucket: "reference"
  endpoint: "uds-minio-hl.minio.svc.cluster.local:9000"
  useSSL: false
  # Credentials secret rendered by the uds-reference-package-config chart
  secretName: "reference-package-minio-creds"
  accessKeyKey: "S3_ACCESS_KEY"
  secretKeyKey: "S3_SECRET_KEY"

# Pod-level security
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

logging:
  dbLevel: "debug" # error, warn, info, debug
