# Values common to all flavors

sso:
  enabled: true
  secretName: reference-package-sso
monitoring:
  enabled: true

# Wire Core's trust bundle through the application chart's generic extensions.
extraVolumes:
  - name: uds-trust-bundle
    configMap:
      name: uds-trust-bundle
      # Core does not create this ConfigMap when no CA bundle is configured.
      optional: true
extraVolumeMounts:
  - name: uds-trust-bundle
    mountPath: /etc/uds/certs
    readOnly: true
extraEnv:
  # Go loads these additional CAs alongside the image's system CA bundle.
  - name: SSL_CERT_DIR
    value: /etc/ssl/certs:/etc/uds/certs

objectStorage:
  enabled: false
  bucket: "reference"
  endpoint: "uds-minio-hl.minio.svc.cluster.local:9000"
  useSSL: false
  # Credentials secret rendered by the uds-reference-package-config chart
  secretName: "reference-package-minio-creds"
  accessKeyKey: "S3_ACCESS_KEY"
  secretKeyKey: "S3_SECRET_KEY"

# Pod-level security
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

logging:
  dbLevel: "debug" # error, warn, info, debug
